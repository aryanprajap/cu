<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Food Delivery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Foodie 🍔</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#menu">Menu</a></li>
                    <li class="nav-item">
                        <button class="btn btn-light ms-lg-3" data-bs-toggle="modal" data-bs-target="#cartModal">
                            Cart (<span id="cartCount">0</span>)
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Carousel -->
    <div id="foodCarousel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=1200"
                    class="d-block w-100 banner" alt="Burger">
                <div class="carousel-caption">
                    <h2>Delicious Burgers</h2>
                    <p>Fresh food delivered to your door.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1200"
                    class="d-block w-100 banner" alt="Pizza">
                <div class="carousel-caption">
                    <h2>Hot & Fresh Pizza</h2>
                    <p>Enjoy your favourite pizza.</p>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#foodCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#foodCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- Menu Section -->
    <section class="container my-5" id="menu">

        <h2 class="text-center mb-4">Our Food Menu 🍕</h2>

        <!-- Search -->
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <input type="text" id="searchInput" class="form-control" placeholder="Search your favourite food...">
            </div>
        </div>

        <!-- Filters -->
        <div class="text-center mb-4">
            <button class="btn btn-danger filter-btn" onclick="filterFood('All')">All</button>
            <button class="btn btn-outline-danger filter-btn" onclick="filterFood('Pizza')">Pizza</button>
            <button class="btn btn-outline-danger filter-btn" onclick="filterFood('Burger')">Burger</button>
            <button class="btn btn-outline-danger filter-btn" onclick="filterFood('Drinks')">Drinks</button>
        </div>

        <!-- Food Cards -->
        <div class="row g-4" id="foodContainer"></div>

    </section>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Your Shopping Cart 🛒</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div id="cartItems"></div>
                    <hr>
                    <h5>Total: ₹<span id="cartTotal">0</span></h5>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-success" onclick="checkout()">
                        Place Order
                    </button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 Foodie. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
</body>

</html>
